[workspace]
members = [
    "crates/fqe-core",
    "crates/fqe-ir",
    "crates/fqe-runtime",
    "crates/fqe-protocol",
    "crates/fqe-cli",
    "crates/fqe-bridge",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/FingerTrader/finger-quant-engine"
publish = false

[workspace.dependencies]
fqe-core = { path = "crates/fqe-core" }
fqe-ir = { path = "crates/fqe-ir" }
fqe-runtime = { path = "crates/fqe-runtime" }
fqe-protocol = { path = "crates/fqe-protocol" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
